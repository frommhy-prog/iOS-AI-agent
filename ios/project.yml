name: TSTZAgent
options:
  bundleIdPrefix: com.Hao-Yi-Miao
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  TSTZAgent:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
    dependencies:
      - target: TSTZLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Hao-Yi-Miao.TSTZ-Agent
        PRODUCT_NAME: TSTZBot
        MARKETING_VERSION: "0.7"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: 知行
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.Hao-Yi-Miao.TSTZ-Agent
            CFBundleURLSchemes:
              - tstzbot
        LSApplicationQueriesSchemes:
          - shortcuts
          - scriptable
        NSMicrophoneUsageDescription: 语音输入需要使用麦克风
        NSSpeechRecognitionUsageDescription: 语音输入需要语音识别
        NSCameraUsageDescription: 拍照后让助理识别文字或转换格式
        NSPhotoLibraryUsageDescription: 读取你的相册，选择照片发给助理识别文字或转换格式，并在今日回顾里统计今天的照片
        NSPhotoLibraryAddUsageDescription: 保存处理后的图片和视频到相册
        NSCalendarsFullAccessUsageDescription: 助理需要为你添加和回顾日程
        NSRemindersFullAccessUsageDescription: 助理需要为你添加和回顾提醒事项
        NSAlarmKitUsageDescription: 助理需要为你设置闹钟
  TSTZLive:
    type: app-extension
    platform: iOS
    sources:
      - path: Live
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Hao-Yi-Miao.TSTZ-Agent.Live
        PRODUCT_NAME: TSTZLive
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.7"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Config/LiveInfo.plist
      properties:
        CFBundleDisplayName: 知行
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
