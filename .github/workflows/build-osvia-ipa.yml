name: build-osvia-ipa

# Manual only: run from Actions tab -> build-osvia-ipa -> Run workflow.
# Produces an UNSIGNED OSVIA.ipa for SideStore to sign on device.
# It does NOT commit anything back to the repo and does NOT create a release.
# Free Apple ID signing cannot happen in the cloud; SideStore signs the
# unsigned IPA on the phone, the same way TSTZ-M's cloud IPA works.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          NEW=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEW" ]; then sudo xcode-select -s "$NEW/Contents/Developer"; fi
          xcodebuild -version

      - name: Make app icon
        run: swift tools/make_icon.swift Sources/Assets.xcassets/AppIcon.appiconset/icon.png

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild -project TSTZAgent.xcodeproj -scheme TSTZAgent -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath derivedData build

      - name: Package unsigned IPA for SideStore
        run: |
          APP=$(find derivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "Built app: $APP"
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist"
          rm -rf Payload OSVIA.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r OSVIA.ipa Payload
          unzip -l OSVIA.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSVIA-ipa
          path: ios/OSVIA.ipa
          if-no-files-found: error
          retention-days: 30
