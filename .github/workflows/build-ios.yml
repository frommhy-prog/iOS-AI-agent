      - name: 编译原生应用与打包 IPA
        run: |
          xcodebuild clean build \
            -project NativeAgentApp.xcodeproj \
            -scheme NativeAgentApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

          mkdir -p Payload
          cp -r build/Release-iphoneos/NativeAgentApp.app Payload/
          zip -r NativeAgentApp.ipa Payload
          ls -la NativeAgentApp.ipa

      - name: 上传构建产物至 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NativeAgentApp-IPA
          path: NativeAgentApp.ipa

      - name: 发布至 GitHub Release 并提供公网下载链接
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.2.0 >/dev/null 2>&1; then
            echo "Release v1.2.0 已存在，上传更新产物..."
            gh release upload v1.2.0 NativeAgentApp.ipa --clobber
          else
            echo "创建 Release v1.2.0 并上传产物..."
            gh release create v1.2.0 NativeAgentApp.ipa \
              --title "iOS 原生工作台 v1.2.0 (全功能版)" \
              --notes "升级多标签原生架构：无水印视频与封面提取存相册、图片格式与无损压缩、Markdown演示文稿转PDF、系统文档保存与原生JSBridge"
          fi
