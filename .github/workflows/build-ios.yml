name: 自动构建原生应用

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 云端 Mac 原生构建
    runs-on: macos-14

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 检查与配置环境
        run: |
          for xcode_path in /Applications/Xcode_16*.app; do
            if [ -d "$xcode_path" ]; then
              echo "切换至 Xcode: $xcode_path"
              sudo xcode-select -s "$xcode_path"
              break
            fi
          done
          xcodebuild -version
          swift --version
          brew install xcodegen

      - name: 编写原生应用源码与工程描述
        run: |
          mkdir -p App
          cat << 'EOF' > App/NativeAgentApp.swift
          import SwiftUI
          import WebKit
          import Photos
          import PhotosUI
          import AVFoundation
          import AVKit
          import PDFKit
          import UniformTypeIdentifiers

          @main
          struct NativeAgentApp: App {
              var body: some Scene {
                  WindowGroup {
                      MainTabView()
                  }
              }
          }

          struct MainTabView: View {
              @State private var selectedTab = 0
              
              var body: some View {
                  TabView(selection: $selectedTab) {
                      WorkbenchTab()
                          .tabItem {
                              Label("AI工作台", systemImage: "sparkles")
                          }
                          .tag(0)
                      
                      MediaCoverTab()
                          .tabItem {
                              Label("封面与视频", systemImage: "play.rectangle.on.rectangle")
                          }
                          .tag(1)
                      
                      FormatConverterTab()
                          .tabItem {
                              Label("格式转换", systemImage: "arrow.triangle.2.circlepath")
                          }
                          .tag(2)
                      
                      DocConverterTab()
                          .tabItem {
                              Label("文档转换", systemImage: "doc.richtext")
                          }
                          .tag(3)
                      
                      ScriptRunnerTab()
                          .tabItem {
                              Label("脚本自动化", systemImage: "terminal.fill")
                          }
                          .tag(4)
                      
                      SystemToolsTab()
                          .tabItem {
                              Label("系统工具", systemImage: "gearshape")
                          }
                          .tag(5)
                  }
              }
          }

          struct WorkbenchTab: View {
              @State private var targetURL = URL(string: "https://frommhy-prog.github.io/iOS-AI-agent/")!
              @State private var statusMessage = "就绪"
              @State private var showingShare = false
              @State private var shareItems: [Any] = []
              @State private var reloadTrigger = false

              var body: some View {
                  NavigationView {
                      VStack(spacing: 0) {
                          WorkbenchWebView(
                              url: targetURL,
                              statusText: $statusMessage,
                              shareItems: $shareItems,
                              showShare: $showingShare,
                              reloadTrigger: $reloadTrigger
                          )
                          .edgesIgnoringSafeArea(.horizontal)
                          
                          HStack {
                              Button(action: { reloadTrigger.toggle() }) {
                                  Image(systemName: "arrow.clockwise")
                              }
                              .padding(.horizontal, 8)
                              
                              Text(statusMessage)
                                  .font(.caption)
                                  .foregroundColor(.secondary)
                                  .lineLimit(1)
                              
                              Spacer()
                              
                              Button(action: {
                                  if let url = URL(string: "https://frommhy-prog.github.io/iOS-AI-agent/") {
                                      shareItems = [url]
                                      showingShare = true
                                  }
                              }) {
                                  Image(systemName: "square.and.arrow.up")
                              }
                              .padding(.horizontal, 8)
                          }
                          .padding(.vertical, 6)
                          .background(Color(UIColor.secondarySystemBackground))
                      }
                      .navigationBarTitle("AI工作台", displayMode: .inline)
                  }
                  .sheet(isPresented: $showingShare) {
                      ShareSheet(items: shareItems)
                  }
              }
          }

          struct WorkbenchWebView: UIViewRepresentable {
              let url: URL
              @Binding var statusText: String
              @Binding var shareItems: [Any]
              @Binding var showShare: Bool
              @Binding var reloadTrigger: Bool

              func makeCoordinator() -> Coordinator {
                  Coordinator(self)
              }

              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  let userContentController = WKUserContentController()
                  userContentController.add(context.coordinator, name: "nativeAgent")
                  config.userContentController = userContentController

                  let webView = WKWebView(frame: .zero, configuration: config)
                  webView.navigationDelegate = context.coordinator
                  let request = URLRequest(url: url)
                  webView.load(request)
                  return webView
              }

              func updateUIView(_ uiView: WKWebView, context: Context) {
                  if context.coordinator.lastReload != reloadTrigger {
                      context.coordinator.lastReload = reloadTrigger
                      uiView.reload()
                  }
              }

              class Coordinator: NSObject, WKNavigationDelegate, WKScriptMessageHandler {
                  var parent: WorkbenchWebView
                  var lastReload: Bool = false

                  init(_ parent: WorkbenchWebView) {
                      self.parent = parent
                  }

                  func webView(_ webView: WKWebView, didStartProvisionalNavigation navigation: WKNavigation!) {
                      parent.statusText = "正在加载..."
                  }

                  func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                      parent.statusText = "页面加载完成"
                      
                      let script = """
                      window.isNativeApp = true;
                      window.nativeSaveImage = function(base64) {
                          window.webkit.messageHandlers.nativeAgent.postMessage({ action: 'saveImage', data: base64 });
                      };
                      window.nativeShare = function(text, url) {
                          window.webkit.messageHandlers.nativeAgent.postMessage({ action: 'share', text: text, url: url });
                      };
                      """
                      webView.evaluateJavaScript(script, completionHandler: nil)
                  }

                  func webView(_ webView: WKWebView, didFail navigation: WKNavigation!, withError error: Error) {
                      parent.statusText = "加载失败: \(error.localizedDescription)"
                  }

                  func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                      guard let dict = message.body as? [String: Any],
                            let action = dict["action"] as? String else { return }

                      if action == "saveImage", let base64 = dict["data"] as? String {
                          saveBase64ToPhotos(base64)
                      } else if action == "share" {
                          var items: [Any] = []
                          if let text = dict["text"] as? String { items.append(text) }
                          if let urlStr = dict["url"] as? String, let url = URL(string: urlStr) { items.append(url) }
                          if !items.isEmpty {
                              parent.shareItems = items
                              parent.showShare = true
                          }
                      }
                  }

                  private func saveBase64ToPhotos(_ base64: String) {
                      let cleaned = base64.replacingOccurrences(of: "data:image/png;base64,", with: "")
                                          .replacingOccurrences(of: "data:image/jpeg;base64,", with: "")
                      guard let data = Data(base64Encoded: cleaned),
                            let image = UIImage(data: data) else {
                          parent.statusText = "图片数据解析失败"
                          return
                      }

                      PHPhotoLibrary.shared().performChanges({
                          PHAssetChangeRequest.creationRequestForAsset(from: image)
                      }) { success, error in
                          DispatchQueue.main.async {
                              if success {
                                  self.parent.statusText = "已成功存入系统相册！"
                              } else {
                                  self.parent.statusText = "保存失败: \(error?.localizedDescription ?? "未知错误")"
                              }
                          }
                      }
                  }
              }
          }

          struct MediaCoverTab: View {
              @State private var videoURLString = ""
              @State private var isProcessing = false
              @State private var coverImage: UIImage?
              @State private var status = "输入视频网络直链提取封面或保存"
              @State private var showingShare = false
              
              var body: some View {
                  NavigationView {
                      Form {
                          Section(header: Text("无水印视频地址")) {
                              TextField("粘贴视频直链 (http/https)", text: $videoURLString)
                                  .keyboardType(.URL)
                                  .autocapitalization(.none)
                          }
                          
                          Section {
                              Button(action: extractCover) {
                                  Label("高清提取视频首帧封面", systemImage: "photo")
                              }
                              .disabled(videoURLString.isEmpty || isProcessing)
                              
                              Button(action: saveVideoToPhotos) {
                                  Label("下载无水印视频存入相册", systemImage: "video.badge.plus")
                              }
                              .disabled(videoURLString.isEmpty || isProcessing)
                          }
                          
                          if let cover = coverImage {
                              Section(header: Text("提取的视频封面")) {
                                  Image(uiImage: cover)
                                      .resizable()
                                      .scaledToFit()
                                      .frame(maxHeight: 220)
                                      .cornerRadius(8)
                                  
                                  Button(action: saveCoverToPhotos) {
                                      Label("保存封面至系统相册", systemImage: "square.and.arrow.down")
                                  }
                                  
                                  Button(action: { showingShare = true }) {
                                      Label("系统分享此封面", systemImage: "square.and.arrow.up")
                                  }
                              }
                          }
                          
                          Section(footer: Text(status).foregroundColor(.secondary)) {
                              EmptyView()
                          }
                      }
                      .navigationBarTitle("封面与无水印视频", displayMode: .inline)
                  }
                  .sheet(isPresented: $showingShare) {
                      if let cover = coverImage {
                          ShareSheet(items: [cover])
                      }
                  }
              }
              
              func extractCover() {
                  guard let url = URL(string: videoURLString.trimmingCharacters(in: .whitespacesAndNewlines)) else {
                      status = "无效的视频 URL"
                      return
                  }
                  isProcessing = true
                  status = "正在提取首帧关键封面..."
                  
                  DispatchQueue.global(qos: .userInitiated).async {
                      let asset = AVURLAsset(url: url)
                      let generator = AVAssetImageGenerator(asset: asset)
                      generator.appliesPreferredTrackTransform = true
                      generator.maximumSize = CGSize(width: 1920, height: 1080)
                      
                      let time = CMTime(seconds: 0.1, preferredTimescale: 600)
                      do {
                          let cgImage = try generator.copyCGImage(at: time, actualTime: nil)
                          let uiImage = UIImage(cgImage: cgImage)
                          DispatchQueue.main.async {
                              self.coverImage = uiImage
                              self.isProcessing = false
                              self.status = "封面提取成功！"
                          }
                      } catch {
                          DispatchQueue.main.async {
                              self.isProcessing = false
                              self.status = "提取失败: \(error.localizedDescription)"
                          }
                      }
                  }
              }
              
              func saveCoverToPhotos() {
                  guard let cover = coverImage else { return }
                  PHPhotoLibrary.shared().performChanges({
                      PHAssetChangeRequest.creationRequestForAsset(from: cover)
                  }) { success, error in
                      DispatchQueue.main.async {
                          if success {
                              self.status = "封面已成功存入系统相册！"
                          } else {
                              self.status = "保存失败: \(error?.localizedDescription ?? "未知错误")"
                          }
                      }
                  }
              }
              
              func saveVideoToPhotos() {
                  guard let url = URL(string: videoURLString.trimmingCharacters(in: .whitespacesAndNewlines)) else {
                      status = "无效的视频 URL"
                      return
                  }
                  isProcessing = true
                  status = "正在下载并写入系统相册..."
                  
                  URLSession.shared.downloadTask(with: url) { localURL, response, error in
                      guard let localURL = localURL, error == nil else {
                          DispatchQueue.main.async {
                              self.isProcessing = false
                              self.status = "下载失败: \(error?.localizedDescription ?? "网络错误")"
                          }
                          return
                      }
                      
                      PHPhotoLibrary.shared().performChanges({
                          PHAssetChangeRequest.creationRequestForAssetFromVideo(atFileURL: localURL)
                      }) { success, saveError in
                          DispatchQueue.main.async {
                              self.isProcessing = false
                              if success {
                                  self.status = "视频已成功存入系统相册！"
                              } else {
                                  self.status = "保存到相册失败: \(saveError?.localizedDescription ?? "未知错误")"
                              }
                          }
                      }
                  }.resume()
              }
          }

          struct FormatConverterTab: View {
              @State private var selectedItem: PhotosPickerItem?
              @State private var selectedImage: UIImage?
              @State private var convertedData: Data?
              @State private var targetFormat = "JPEG"
              @State private var compressionQuality: Double = 0.8
              @State private var status = "请选择需要转换格式或压缩的图片"
              @State private var showingShare = false
              
              let formats = ["JPEG", "PNG"]
              
              var body: some View {
                  NavigationView {
                      Form {
                          Section(header: Text("图片来源")) {
                              PhotosPicker(selection: $selectedItem, matching: .images) {
                                  Label("从系统相册选择图片", systemImage: "photo.on.rectangle")
                              }
                              .onChange(of: selectedItem) { newItem in
                                  Task {
                                      if let data = try? await newItem?.loadTransferable(type: Data.self),
                                         let uiImage = UIImage(data: data) {
                                          await MainActor.run {
                                              self.selectedImage = uiImage
                                              self.convertedData = nil
                                              self.status = "图片已载入，原尺寸: \(Int(uiImage.size.width))x\(Int(uiImage.size.height))"
                                          }
                                      }
                                  }
                              }
                          }
                          
                          if let img = selectedImage {
                              Section(header: Text("图片预览")) {
                                  Image(uiImage: img)
                                      .resizable()
                                      .scaledToFit()
                                      .frame(maxHeight: 180)
                              }
                              
                              Section(header: Text("目标格式与压缩比率")) {
                                  Picker("目标格式", selection: $targetFormat) {
                                      ForEach(formats, id: \.self) {
                                          Text($0)
                                      }
                                  }
                                  .pickerStyle(SegmentedPickerStyle())
                                  
                                  if targetFormat == "JPEG" {
                                      VStack(alignment: .leading) {
                                          Text("压缩质量: \(Int(compressionQuality * 100))%")
                                          Slider(value: $compressionQuality, in: 0.1...1.0, step: 0.05)
                                      }
                                  }
                                  
                                  Button(action: convertImage) {
                                      Label("开始转换处理", systemImage: "wand.and.stars")
                                  }
                              }
                          }
                          
                          if let data = convertedData {
                              Section(header: Text("处理结果")) {
                                  Text("生成文件大小: \(data.count / 1024) KB")
                                      .foregroundColor(.green)
                                  
                                  Button(action: saveConvertedToPhotos) {
                                      Label("存入系统相册", systemImage: "square.and.arrow.down")
                                  }
                                  
                                  Button(action: { showingShare = true }) {
                                      Label("系统分享 / 隔空投送", systemImage: "square.and.arrow.up")
                                  }
                              }
                          }
                          
                          Section(footer: Text(status).foregroundColor(.secondary)) {
                              EmptyView()
                          }
                      }
                      .navigationBarTitle("图片格式与压缩", displayMode: .inline)
                  }
                  .sheet(isPresented: $showingShare) {
                      if let data = convertedData, let img = UIImage(data: data) {
                          ShareSheet(items: [img])
                      }
                  }
              }
              
              func convertImage() {
                  guard let img = selectedImage else { return }
                  switch targetFormat {
                  case "JPEG":
                      convertedData = img.jpegData(compressionQuality: compressionQuality)
                  case "PNG":
                      convertedData = img.pngData()
                  default:
                      convertedData = img.jpegData(compressionQuality: compressionQuality)
                  }
                  status = "转换完成，已就绪"
              }
              
              func saveConvertedToPhotos() {
                  guard let data = convertedData, let img = UIImage(data: data) else { return }
                  PHPhotoLibrary.shared().performChanges({
                      PHAssetChangeRequest.creationRequestForAsset(from: img)
                  }) { success, error in
                      DispatchQueue.main.async {
                          if success {
                              self.status = "已成功保存到系统相册！"
                          } else {
                              self.status = "保存失败: \(error?.localizedDescription ?? "未知错误")"
                          }
                      }
                  }
              }
          }

          struct DocConverterTab: View {
              @State private var docTitle = "自动化报告演示"
              @State private var docContent = "# 自动化经营分析简报\n\n1. 核心指标统计\n- 今日订单流速稳定\n- 违规项检测：0 项\n\n2. 总结结论\n系统已全自动化接入，支持本地相册、文档导出与高清处理。"
              @State private var pdfData: Data?
              @State private var pdfURL: URL?
              @State private var status = "输入文本或结构化内容生成 PDF"
              @State private var showingShare = false
              
              var body: some View {
                  NavigationView {
                      Form {
                          Section(header: Text("演示文档标题")) {
                              TextField("输入文档标题", text: $docTitle)
                          }
                          
                          Section(header: Text("文档正文 / Markdown 内容")) {
                              TextEditor(text: $docContent)
                                  .frame(minHeight: 140)
                          }
                          
                          Section {
                              Button(action: generatePDF) {
                                  Label("渲染并导出矢量 PDF 演示文件", systemImage: "doc.text")
                              }
                          }
                          
                          if let data = pdfData {
                              Section(header: Text("生成产物")) {
                                  Text("PDF 文档大小: \(data.count / 1024) KB")
                                      .foregroundColor(.blue)
                                  
                                  Button(action: { showingShare = true }) {
                                      Label("系统分享 / 存储到文件", systemImage: "square.and.arrow.up")
                                  }
                              }
                          }
                          
                          Section(footer: Text(status).foregroundColor(.secondary)) {
                              EmptyView()
                          }
                      }
                      .navigationBarTitle("文档与演示文稿转换", displayMode: .inline)
                  }
                  .sheet(isPresented: $showingShare) {
                      if let url = pdfURL {
                          ShareSheet(items: [url])
                      }
                  }
              }
              
              func generatePDF() {
                  let pageWidth: CGFloat = 595.2
                  let pageHeight: CGFloat = 841.8
                  let pageRect = CGRect(x: 0, y: 0, width: pageWidth, height: pageHeight)
                  
                  let renderer = UIGraphicsPDFRenderer(bounds: pageRect)
                  let data = renderer.pdfData { context in
                      context.beginPage()
                      
                      let titleFont = UIFont.boldSystemFont(ofSize: 22)
                      let titleAttrs: [NSAttributedString.Key: Any] = [.font: titleFont, .foregroundColor: UIColor.black]
                      let titleRect = CGRect(x: 40, y: 40, width: pageWidth - 80, height: 35)
                      (docTitle as NSString).draw(in: titleRect, withAttributes: titleAttrs)
                      
                      let bodyFont = UIFont.systemFont(ofSize: 14)
                      let paragraphStyle = NSMutableParagraphStyle()
                      paragraphStyle.lineSpacing = 6
                      let bodyAttrs: [NSAttributedString.Key: Any] = [
                          .font: bodyFont,
                          .foregroundColor: UIColor.darkGray,
                          .paragraphStyle: paragraphStyle
                      ]
                      let bodyRect = CGRect(x: 40, y: 90, width: pageWidth - 80, height: pageHeight - 130)
                      (docContent as NSString).draw(in: bodyRect, withAttributes: bodyAttrs)
                  }
                  
                  let fileURL = FileManager.default.temporaryDirectory.appendingPathComponent("\(docTitle.isEmpty ? "Presentation" : docTitle).pdf")
                  try? data.write(to: fileURL)
                  self.pdfURL = fileURL
                  self.pdfData = data
                  self.status = "PDF 渲染成功！"
              }
          }

          struct ScriptRunnerTab: View {
              @State private var scriptType = 0
              @State private var token = ""
              @State private var intervalMinutes = "240"
              @State private var autoGroupClaim = true
              @State private var isRunning = false
              @State private var logs = "=== 脚本自动化引擎就绪 ===\n支持定时调度、网络请求与控制台日志。\n"
              @State private var remainingSeconds = 0
              @State private var countdownTimer: Timer? = nil

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(spacing: 16) {
                              VStack(alignment: .leading, spacing: 12) {
                                  Text("脚本选择与配置")
                                      .font(.headline)
                                  
                                  Picker("脚本类型", selection: $scriptType) {
                                      Text("Interlink Network 自动挖矿").tag(0)
                                      Text("自定义 HTTP 巡检脚本").tag(1)
                                  }
                                  .pickerStyle(.segmented)
                                  
                                  VStack(alignment: .leading, spacing: 6) {
                                      Text("认证令牌 (Bearer Token):")
                                          .font(.subheadline)
                                          .foregroundColor(.secondary)
                                      SecureField("输入 Interlink Access Token", text: $token)
                                          .textFieldStyle(RoundedBorderTextFieldStyle())
                                          .autocorrectionDisabled()
                                          .textInputAutocapitalization(.never)
                                  }
                                  
                                  HStack {
                                      VStack(alignment: .leading, spacing: 6) {
                                          Text("执行周期 (分钟):")
                                              .font(.subheadline)
                                              .foregroundColor(.secondary)
                                          TextField("240", text: $intervalMinutes)
                                              .textFieldStyle(RoundedBorderTextFieldStyle())
                                              .keyboardType(.numberPad)
                                      }
                                      
                                      Toggle("组队领取", isOn: $autoGroupClaim)
                                          .padding(.top, 16)
                                  }
                              }
                              .padding()
                              .background(Color(.secondarySystemBackground))
                              .cornerRadius(12)
                              
                              HStack(spacing: 12) {
                                  Button {
                                      Task {
                                          await runScriptOnce()
                                      }
                                  } label: {
                                      HStack {
                                          Image(systemName: "play.circle.fill")
                                          Text("立即执行一次")
                                      }
                                      .frame(maxWidth: .infinity)
                                      .padding()
                                      .background(Color.blue)
                                      .foregroundColor(.white)
                                      .cornerRadius(10)
                                  }
                                  .disabled(isRunning)
                                  
                                  Button {
                                      if isRunning {
                                          stopPeriodicExecution()
                                      } else {
                                          startPeriodicExecution()
                                      }
                                  } label: {
                                      HStack {
                                          Image(systemName: isRunning ? "stop.circle.fill" : "repeat.circle.fill")
                                          Text(isRunning ? "停止循环" : "启动周期运行")
                                      }
                                      .frame(maxWidth: .infinity)
                                      .padding()
                                      .background(isRunning ? Color.red : Color.green)
                                      .foregroundColor(.white)
                                      .cornerRadius(10)
                                  }
                              }
                              
                              if isRunning && remainingSeconds > 0 {
                                  HStack {
                                      Image(systemName: "clock.arrow.circlepath")
                                      Text("距离下次执行: \(remainingSeconds / 60)分\(remainingSeconds % 60)秒")
                                          .font(.subheadline)
                                          .foregroundColor(.blue)
                                  }
                                  .padding(.vertical, 4)
                              }
                              
                              VStack(alignment: .leading, spacing: 8) {
                                  HStack {
                                      Text("终端运行日志")
                                          .font(.headline)
                                      Spacer()
                                      Button("清空") {
                                          logs = ""
                                      }
                                      .font(.caption)
                                      Button("复制") {
                                          UIPasteboard.general.string = logs
                                      }
                                      .font(.caption)
                                  }
                                  
                                  ScrollView {
                                      Text(logs.isEmpty ? "暂无日志" : logs)
                                          .font(.system(size: 11, design: .monospaced))
                                          .foregroundColor(.green)
                                          .frame(maxWidth: .infinity, alignment: .leading)
                                          .padding(8)
                                  }
                                  .frame(height: 220)
                                  .background(Color.black)
                                  .cornerRadius(8)
                              }
                              .padding()
                              .background(Color(.secondarySystemBackground))
                              .cornerRadius(12)
                          }
                          .padding()
                      }
                      .navigationTitle("脚本自动化")
                  }
              }
              
              private func appendLog(_ message: String) {
                  let formatter = DateFormatter()
                  formatter.dateFormat = "HH:mm:ss"
                  let timestamp = formatter.string(from: Date())
                  logs += "[\(timestamp)] \(message)\n"
              }
              
              private func runScriptOnce() async {
                  let cleanToken = token.trimmingCharacters(in: .whitespacesAndNewlines)
                  if cleanToken.isEmpty {
                      appendLog("错误: 认证令牌不能为空，请输入 Interlink Token。")
                      return
                  }
                  
                  appendLog("开始执行 Interlink Network 自动化流程...")
                  
                  // 1. 请求单人 4 小时挖矿奖励
                  await executeClaim(endpoint: "https://prod.interlinklabs.ai/api/v1/token/claim-airdrop", name: "个人挖矿奖励", token: cleanToken)
                  
                  // 2. 如果开启组队挖矿，请求组队收益
                  if autoGroupClaim {
                      try? await Task.sleep(nanoseconds: 2_000_000_000)
                      await executeClaim(endpoint: "https://prod.interlinklabs.ai/api/v1/mining/group-claim", name: "组队挖矿收益", token: cleanToken)
                  }
                  
                  appendLog("当前轮次执行完毕。")
              }
              
              private func executeClaim(endpoint: String, name: String, token: String) async {
                  guard let url = URL(string: endpoint) else {
                      appendLog("无效请求地址: \(endpoint)")
                      return
                  }
                  
                  var request = URLRequest(url: url)
                  request.httpMethod = "POST"
                  request.setValue("Bearer \(token)", forHTTPHeaderField: "Authorization")
                  request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  request.setValue("InterLink/4.0.5 (iOS; iPhone; Scale/3.00)", forHTTPHeaderField: "User-Agent")
                  request.httpBody = "{}".data(using: .utf8)
                  
                  appendLog("正在发送 [\(name)] 请求...")
                  do {
                      let (data, response) = try await URLSession.shared.data(for: request)
                      if let httpResponse = response as? HTTPURLResponse {
                          let status = httpResponse.statusCode
                          let respString = String(data: data, encoding: .utf8) ?? "空响应"
                          if status == 200 {
                              appendLog("[\(name)] 成功 (状态码 200): \(respString.prefix(100))")
                          } else {
                              appendLog("[\(name)] 响应状态码: \(status), 内容: \(respString.prefix(120))")
                          }
                      }
                  } catch {
                      appendLog("[\(name)] 请求异常: \(error.localizedDescription)")
                  }
              }
              
              private func startPeriodicExecution() {
                  let cleanToken = token.trimmingCharacters(in: .whitespacesAndNewlines)
                  if cleanToken.isEmpty {
                      appendLog("错误: 请先输入认证令牌再启动循环。")
                      return
                  }
                  
                  let mins = Int(intervalMinutes) ?? 240
                  let intervalSec = max(mins * 60, 60)
                  
                  isRunning = true
                  appendLog("已启动周期定时器，设定周期: \(mins) 分钟 (\(intervalSec) 秒)。")
                  
                  Task {
                      await runScriptOnce()
                  }
                  
                  remainingSeconds = intervalSec
                  countdownTimer?.invalidate()
                  countdownTimer = Timer.scheduledTimer(withTimeInterval: 1.0, repeats: true) { _ in
                      if remainingSeconds > 0 {
                          remainingSeconds -= 1
                      } else {
                          remainingSeconds = intervalSec
                          Task {
                              await runScriptOnce()
                          }
                      }
                  }
              }
              
              private func stopPeriodicExecution() {
                  isRunning = false
                  countdownTimer?.invalidate()
                  countdownTimer = nil
                  remainingSeconds = 0
                  appendLog("已停止周期执行。")
              }
          }

          struct SystemToolsTab: View {
              @State private var photoAuthStatus = "检测中"
              @State private var cameraAuthStatus = "检测中"
              @State private var cacheSize = "计算中"
              
              var body: some View {
                  NavigationView {
                      List {
                          Section(header: Text("系统权限状态")) {
                              HStack {
                                  Text("相册读写权限")
                                  Spacer()
                                  Text(photoAuthStatus)
                                      .foregroundColor(.secondary)
                              }
                              HStack {
