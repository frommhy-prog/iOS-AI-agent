name: 自动构建原生应用

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 云端 Mac 原生构建
    runs-on: macos-14

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 检查与配置环境
        run: |
          for xcode_path in /Applications/Xcode_16*.app; do
            if [ -d "$xcode_path" ]; then
              echo "切换至 Xcode: $xcode_path"
              sudo xcode-select -s "$xcode_path"
              break
            fi
          done
          xcodebuild -version
          swift --version
          brew install xcodegen

      - name: 编写原生应用源码与工程描述
        run: |
          mkdir -p App
          cat << 'EOF' > App/NativeAgentApp.swift
          import SwiftUI
          import WebKit
          import PhotosUI

          @main
          struct NativeAgentApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }

          struct WebView: UIViewRepresentable {
              let url: URL

              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  let webView = WKWebView(frame: .zero, configuration: config)
                  return webView
              }

              func updateUIView(_ uiView: WKWebView, context: Context) {
                  let request = URLRequest(url: url)
                  uiView.load(request)
              }
          }

          struct ContentView: View {
              @State private var targetURL = URL(string: "https://frommhy-prog.github.io/iOS-AI-agent/")!
              @State private var showingShareSheet = false
              @State private var statusMessage = "就绪"

              var body: some View {
                  NavigationView {
                      VStack(spacing: 0) {
                          WebView(url: targetURL)
                              .edgesIgnoringSafeArea(.all)
                          HStack {
                              Button(action: {
                                  showingShareSheet = true
                              }) {
                                  Label("系统分享", systemImage: "square.and.arrow.up")
                                      .font(.headline)
                                      .padding(.vertical, 8)
                                      .padding(.horizontal, 16)
                                      .background(Color.blue)
                                      .foregroundColor(.white)
                                      .cornerRadius(8)
                              }
                              Spacer()
                              Text(statusMessage)
                                  .font(.subheadline)
                                  .foregroundColor(.secondary)
                          }
                          .padding()
                          .background(Color(UIColor.secondarySystemBackground))
                      }
                      .navigationBarTitle("iOS 智能工作台", displayMode: .inline)
                  }
                  .sheet(isPresented: $showingShareSheet) {
                      ShareSheet(items: [targetURL])
                  }
              }
          }

          struct ShareSheet: UIViewControllerRepresentable {
              let items: [Any]

              func makeUIViewController(context: Context) -> UIActivityViewController {
                  return UIActivityViewController(activityItems: items, applicationActivities: nil)
              }

              func updateUIViewController(_ uiViewController: UIActivityViewController, context: Context) {}
          }
          EOF

          cat << 'EOF' > App/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.frommhy.nativeagent</string>
              <key>CFBundleName</key>
              <string>NativeAgentApp</string>
              <key>CFBundleDisplayName</key>
              <string>AI工作台</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSCameraUsageDescription</key>
              <string>需要访问相机以拍摄与处理图片</string>
              <key>NSPhotoLibraryAddUsageDescription</key>
              <string>需要保存处理后的无水印图片与视频到相册</string>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>需要读取相册以选择需要转换与处理的媒体文件</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > project.yml
          name: NativeAgentApp
          options:
            bundleIdPrefix: com.frommhy
            deploymentTarget:
              iOS: "16.0"
            xcodeVersion: "16.1"
          targets:
            NativeAgentApp:
              type: application
              platform: iOS
              sources: [App]
              info:
                path: App/Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.frommhy.nativeagent
                  INFOPLIST_FILE: App/Info.plist
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
          EOF

          xcodegen generate

      - name: 编译原生应用与打包 IPA
        run: |
          xcodebuild clean build \
            -project NativeAgentApp.xcodeproj \
            -scheme NativeAgentApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

          mkdir -p Payload
          cp -r build/Release-iphoneos/NativeAgentApp.app Payload/
          zip -r NativeAgentApp.ipa Payload
          ls -la NativeAgentApp.ipa

      - name: 上传构建产物至 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NativeAgentApp-IPA
          path: NativeAgentApp.ipa

      - name: 发布至 GitHub Release 并提供公网下载链接
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Release v1.0.0 已存在，上传更新产物..."
            gh release upload v1.0.0 NativeAgentApp.ipa --clobber
          else
            echo "创建 Release v1.0.0 并上传产物..."
            gh release create v1.0.0 NativeAgentApp.ipa \
              --title "iOS 原生工作台 v1.0.0" \
              --notes "未签名原生应用安装包，支持副店助手导入自签"
          fi
