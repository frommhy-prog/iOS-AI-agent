name: 自动构建原生应用

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 云端 Mac 原生构建
    runs-on: macos-14

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 检查与配置环境
        run: |
          for xcode_path in /Applications/Xcode_16*.app; do
            if [ -d "$xcode_path" ]; then
              sudo xcode-select -s "$xcode_path"
              break
            fi
          done
          xcodebuild -version
          swift --version
          brew install xcodegen

      - name: 编写原生应用源码与工程描述
        run: |
          mkdir -p App
          cat << 'EOF' > App/NativeAgentApp.swift
          import SwiftUI

          @main
          struct NativeAgentApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat << 'EOF' > App/ContentView.swift
          import SwiftUI
          import Photos

          struct ContentView: View {
              @State private var inputUrl: String = ""
              @State private var statusMessage: String = "就绪"
              @State private var isProcessing: Bool = false
              @State private var selectedTab: Int = 0

              var body: some View {
                  TabView(selection: $selectedTab) {
                      NavigationView {
                          VStack(spacing: 20) {
                              Text("iOS 智能工作台")
                                  .font(.largeTitle)
                                  .bold()
                                  .padding(.top)

                              VStack(alignment: .leading, spacing: 10) {
                                  Text("媒体解析与无水印提取")
                                      .font(.headline)
                                  TextField("输入平台分享链接...", text: $inputUrl)
                                      .textFieldStyle(RoundedBorderTextFieldStyle())
                                      .autocapitalization(.none)

                                  HStack {
                                      Button(action: {
                                          processMedia()
                                      }) {
                                          Text(isProcessing ? "解析中..." : "解析媒体")
                                              .bold()
                                              .frame(maxWidth: .infinity)
                                              .padding()
                                              .background(Color.blue)
                                              .foregroundColor(.white)
                                              .cornerRadius(10)
                                      }
                                      .disabled(isProcessing)
                                  }
                              }
                              .padding()
                              .background(Color(.systemGray6))
                              .cornerRadius(12)

                              VStack(alignment: .leading, spacing: 10) {
                                  Text("原生功能状态")
                                      .font(.headline)
                                  Text(statusMessage)
                                      .font(.subheadline)
                                      .foregroundColor(.secondary)
                              }
                              .padding()
                              .frame(maxWidth: .infinity, alignment: .leading)
                              .background(Color(.systemGray6))
                              .cornerRadius(12)

                              Spacer()
                          }
                          .padding()
                          .navigationTitle("工作台")
                      }
                      .tabItem {
                          Label("解析", systemImage: "arrow.down.circle")
                      }
                      .tag(0)

                      NavigationView {
                          List {
                              Section(header: Text("文件与格式处理")) {
                                  Text("文档转换与导出")
                                  Text("演示文稿转换")
                                  Text("图片水印处理")
                              }
                              Section(header: Text("原生权限支持")) {
                                  Text("相册读写保存已启用")
                                  Text("原生系统分享已启用")
                              }
                          }
                          .navigationTitle("工具箱")
                      }
                      .tabItem {
                          Label("工具", systemImage: "wrench.and.screwdriver")
                      }
                      .tag(1)
                  }
              }

              func processMedia() {
                  guard !inputUrl.isEmpty else {
                      statusMessage = "请先输入分享链接"
                      return
                  }
                  isProcessing = true
                  statusMessage = "正在解析任务..."
                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.0) {
                      isProcessing = false
                      statusMessage = "任务已提交处理"
                  }
              }
          }
          EOF

          cat << 'EOF' > project.yml
          name: NativeAgentApp
          options:
            bundleIdPrefix: com.frommhy
            deploymentTarget:
              iOS: 16.0
          targets:
            NativeAgentApp:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: App
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.frommhy.NativeAgentApp
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: 原生工作台
                  INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 用于将处理后的无水印图片和视频保存到系统相册
                  INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 用于访问与保存媒体文件
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
                  AD_HOC_CODE_SIGNING_ALLOWED: YES
          EOF

          xcodegen generate

          python3 -c '
          with open("NativeAgentApp.xcodeproj/project.pbxproj", "r") as f:
              c = f.read()
          import re
          c = re.sub(r"objectVersion = d+;", "objectVersion = 56;", c)
          c = re.sub(r"compatibilityVersion = "[^"]+";", "compatibilityVersion = "Xcode 14.0";", c)
          with open("NativeAgentApp.xcodeproj/project.pbxproj", "w") as f:
              f.write(c)
          print("工程版本修补完成")
          '

      - name: 编译原生应用与打包 IPA
        run: |
          xcodebuild clean build \
            -project NativeAgentApp.xcodeproj \
            -scheme NativeAgentApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          APP_DIR=$(find ./build -name "NativeAgentApp.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "未找到编译生成的 NativeAgentApp.app 目录"
            exit 1
          fi

          echo "找到应用目录: $APP_DIR"
          rm -rf Payload NativeAgentApp.ipa
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          zip -qr NativeAgentApp.ipa Payload

          echo "IPA 文件打包完成:"
          ls -lh NativeAgentApp.ipa

      - name: 上传构建产物至 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NativeAgentApp-IPA
          path: NativeAgentApp.ipa
          if-no-files-found: error

      - name: 发布至 GitHub Release 并提供公网下载链接
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 NativeAgentApp.ipa \
            --title "iOS 原生工作台 v1.0.0" \
            --notes "未签名原生应用安装包，支持副店助手导入自签" \
            --clobber || gh release upload v1.0.0 NativeAgentApp.ipa --clobber
