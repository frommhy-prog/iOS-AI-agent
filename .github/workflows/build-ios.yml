                                  Spacer()
                                  Text(cameraAuthStatus)
                                      .foregroundColor(.secondary)
                              }
                              Button(action: checkPermissions) {
                                  Text("刷新权限状态")
                              }
                          }
                          
                          Section(header: Text("沙盒与缓存管理")) {
                              HStack {
                                  Text("临时缓存占用")
                                  Spacer()
                                  Text(cacheSize)
                                      .foregroundColor(.secondary)
                              }
                              Button(action: clearCache) {
                                  Text("清理沙盒缓存")
                                      .foregroundColor(.red)
                              }
                          }
                          
                          Section(header: Text("环境与版本")) {
                              HStack {
                                  Text("应用标识")
                                  Spacer()
                                  Text("com.frommhy.nativeagent")
                                      .font(.caption)
                              }
                              HStack {
                                  Text("版本")
                                  Spacer()
                                  Text("1.1.0")
                              }
                              HStack {
                                  Text("系统兼容")
                                  Spacer()
                                  Text("iOS 16.0 ~ 26.6.1+")
                              }
                          }
                      }
                      .navigationBarTitle("系统工具与设置", displayMode: .inline)
                      .onAppear {
                          checkPermissions()
                          calculateCache()
                      }
                  }
              }
              
              func checkPermissions() {
                  let photo = PHPhotoLibrary.authorizationStatus(for: .readWrite)
                  switch photo {
                  case .authorized, .limited: photoAuthStatus = "已授权"
                  case .denied, .restricted: photoAuthStatus = "已拒绝"
                  case .notDetermined: photoAuthStatus = "未授权"
                  @unknown default: photoAuthStatus = "未知"
                  }
                  
                  let camera = AVCaptureDevice.authorizationStatus(for: .video)
                  switch camera {
                  case .authorized: cameraAuthStatus = "已授权"
                  case .denied, .restricted: cameraAuthStatus = "已拒绝"
                  case .notDetermined: cameraAuthStatus = "未授权"
                  @unknown default: cameraAuthStatus = "未知"
                  }
              }
              
              func calculateCache() {
                  let tmp = FileManager.default.temporaryDirectory
                  if let files = try? FileManager.default.contentsOfDirectory(atPath: tmp.path) {
                      cacheSize = "\(files.count) 个临时文件"
                  } else {
                      cacheSize = "0 个文件"
                  }
              }
              
              func clearCache() {
                  let tmp = FileManager.default.temporaryDirectory
                  if let files = try? FileManager.default.contentsOfDirectory(atPath: tmp.path) {
                      for f in files {
                          try? FileManager.default.removeItem(at: tmp.appendingPathComponent(f))
                      }
                  }
                  calculateCache()
              }
          }

